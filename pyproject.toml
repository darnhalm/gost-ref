[project]
name = "gost-ref"
version = "1.0.0"
description = "Библиографические ссылки и записи по ГОСТ Р 7.0.5-2008, 7.0.100-2018, 7.1-2003, 7.0.108-2022"
requires-python = ">=3.10"
dependencies = []

# Ядро остаётся без зависимостей.
#
# Верхняя граница у mcp стоит намеренно: в 2.0 FastMCP переименован в
# MCPServer (модуль mcp.server.fastmcp удалён), и автоматический подъём major
# сломал бы server.py.
#
# Нижняя граница — 1.14: до неё FastMCP падает на аннотации `dict | None`
# (`validate_reference`, `repeat_reference`) — «issubclass() arg 1 must be a
# class». Прежнее `mcp>=1.2` этого не учитывало. Диапазон проверен прогоном
# тестов на 1.14.0 и 1.30.0.
[project.optional-dependencies]
mcp = ["mcp>=1.14,<2"]
pdf = ["pypdf>=3.0,<7"]
server = ["mcp>=1.14,<2", "pypdf>=3.0,<7"]
all = ["mcp>=1.14,<2", "pypdf>=3.0,<7"]
dev = ["mcp>=1.14,<2", "pypdf>=3.0,<7", "pytest>=7", "httpx>=0.27"]

[project.scripts]
gost-ref = "gost_ref.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gost_ref"]
