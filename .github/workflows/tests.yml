name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:      # вызывается из deploy.yml перед выкладкой

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Ядро проверяем и без зависимостей: оно должно работать на голой
      # стандартной библиотеке — на этом держится установка «клонировал и
      # пользуйся» из INSTALL.md.
      # Ядро проверяем на голой стандартной библиотеке (из инструментов —
      # только сам pytest): на этом держится установка «клонировал и
      # пользуйся» из INSTALL.md. Smoke-тесты удалённого режима на этом шаге
      # пропускаются сами — им нужны mcp и httpx.
      - name: Ядро без зависимостей
        run: |
          pip install pytest
          python -m pytest tests/ -q
        env:
          PYTHONPATH: .

      - name: Установка с MCP SDK
        run: pip install -e ".[dev]"

      - name: Все тесты, включая smoke удалённого режима
        run: python -m pytest tests/ -q
